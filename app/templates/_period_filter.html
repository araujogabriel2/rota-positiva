<form method="get" class="filter-card mb-4" data-period-form>
  <div class="d-flex flex-wrap gap-2 period-pills mb-3">
    <a class="btn {{ 'active' if period == 'today' }}" href="{{ url_for(request.endpoint, period='today') }}">Hoje</a>
    <a class="btn {{ 'active' if period == '7days' }}" href="{{ url_for(request.endpoint, period='7days') }}">Últimos 7 dias</a>
    <a class="btn {{ 'active' if period == 'month' }}" href="{{ url_for(request.endpoint, period='month') }}">Mês atual</a>
    <button class="btn {{ 'active' if period == 'custom' }}" type="button" data-custom-period>Personalizado</button>
  </div>
  <div class="row g-3 {{ '' if period == 'custom' else 'd-none' }}" data-custom-fields>
    <input type="hidden" name="period" value="custom" {% if period != 'custom' %}disabled{% endif %} data-custom-input>
    <div class="col-sm-5">
      <label class="form-label" for="start">Data inicial</label>
      <input class="form-control" type="date" id="start" name="start" value="{{ start.isoformat() }}">
    </div>
    <div class="col-sm-5">
      <label class="form-label" for="end">Data final</label>
      <input class="form-control" type="date" id="end" name="end" value="{{ end.isoformat() }}">
    </div>
    <div class="col-sm-2 d-flex align-items-end">
      <button class="btn btn-primary w-100" type="submit">Aplicar</button>
    </div>
  </div>
</form>
