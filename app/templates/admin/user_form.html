{% extends 'base.html' %}
{% block title %}Novo motorista · Rota Positiva{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="page-heading mb-4"><h1>Novo motorista</h1><p>O sistema gerará uma senha temporária para o primeiro acesso.</p></div><div class="content-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Nome</label><input class="form-control form-control-lg" id="name" name="name" maxlength="100" required></div><div class="mb-4"><label class="form-label" for="username">Nome de usuário</label><input class="form-control form-control-lg" id="username" name="username" minlength="3" maxlength="40" required><div class="form-text">Use letras minúsculas, números, ponto, traço ou sublinhado.</div></div><div class="d-flex flex-column flex-sm-row gap-2"><a class="btn btn-light" href="{{ url_for('admin.users') }}">Cancelar</a><button class="btn btn-accent flex-grow-1" type="submit">Criar conta e gerar senha</button></div></form></div></div></div>
{% endblock %}
