{% extends 'base.html' %}
{% block title %}Criar senha pessoal · Rota Positiva{% endblock %}
{% block content %}
<div class="row justify-content-center py-lg-5"><div class="col-md-7 col-lg-5"><div class="content-card">
  <span class="eyebrow">PRIMEIRO ACESSO</span><h1 class="h3 mt-2">Crie sua senha pessoal</h1>
  <p class="text-secondary">A senha temporária será invalidada depois desta troca.</p>
  <form method="post" class="mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="password">Nova senha</label><input class="form-control form-control-lg" type="password" id="password" name="password" minlength="12" required autocomplete="new-password"><div class="form-text">Use pelo menos 12 caracteres.</div></div>
    <div class="mb-4"><label class="form-label" for="password_confirmation">Confirmar nova senha</label><input class="form-control form-control-lg" type="password" id="password_confirmation" name="password_confirmation" minlength="12" required autocomplete="new-password"></div>
    <button class="btn btn-accent btn-lg w-100" type="submit">Salvar minha senha</button>
  </form>
</div></div></div>
{% endblock %}
