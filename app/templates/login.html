{% extends 'base.html' %}
{% block title %}Entrar · Rota Positiva{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-5 col-lg-4">
    <div class="login-card p-4 p-md-5 rounded-4 border-0">
      <!-- Logo e título -->
      <div class="text-center mb-4">
        <div class="brand-logo mx-auto">R+</div>
        <h2 class="h4 fw-bold mt-3 text-white">Rota Positiva</h2>
        <p class="text-muted small">Controle financeiro para motoristas</p>
      </div>

      <!-- Formulário de autenticação -->
      <form method="post" action="{{ url_for('main.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input type="text" class="form-control form-control-lg" id="username" name="username" required placeholder="admin" autofocus>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-accent btn-lg w-100 py-3 mt-2">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
