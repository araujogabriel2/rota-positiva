{% extends 'base.html' %}
{% block title %}Entrar · Rota Positiva{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-5 col-lg-4">
    <div class="login-card p-4 p-md-5 rounded-4 border-0">
      <!-- Logo e título -->
      <div class="text-center mb-4">
        <div class="brand-logo mx-auto">R+</div>
        <h2 class="h4 fw-bold mt-3 text-white">Rota Positiva</h2>
        <p class="text-muted small">Controle financeiro para motoristas</p>
      </div>

      <!-- Login Social -->
      <a href="{{ url_for('auth.login_google') }}" class="btn btn-outline-light w-100 py-3 mb-3 d-flex align-items-center justify-content-center gap-2" style="border-color: #3b454a; color: #edf2f3; background: #1a2226; font-size: 0.95rem; border-radius: 10px; font-weight: 600;">
        <img src="https://authjs.dev/img/providers/google.svg" alt="Google Logo" width="20" height="20">
        Entrar com o Google
      </a>

      <div class="text-center my-3 position-relative d-flex align-items-center justify-content-center">
        <hr class="w-100" style="border-color: var(--line);">
        <span class="px-2 position-absolute" style="background: #14181b; color: var(--muted); font-size: 0.8rem; font-weight: 700;">OU</span>
      </div>

      <!-- Formulário de autenticação -->
      <form method="post" action="{{ url_for('auth.login') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input type="text" class="form-control form-control-lg" id="username" name="username" required autocomplete="username" placeholder="seu.usuario" autofocus>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password" required autocomplete="current-password" placeholder="Sua senha">
        </div>
        
        <button type="submit" class="btn btn-accent btn-lg w-100 py-3 mt-2">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
